name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bot, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ${{ matrix.service }}

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot dashboard and smoke test
        run: |
          docker compose up -d dashboard
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8090/ > /dev/null; then
              echo "dashboard responded"
              exit 0
            fi
            sleep 1
          done
          echo "dashboard did not become healthy in time"
          docker compose logs dashboard
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
