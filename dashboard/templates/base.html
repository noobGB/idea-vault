<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Idea Vault{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e5;
    --muted: #6b6b70;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #ececec;
      --card-bg: #1c1c1f;
      --border: #2c2c30;
      --muted: #9a9aa0;
      --accent: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header { padding: 24px; max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .subtitle { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
  form.search { display: flex; gap: 8px; }
  input[type="search"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  main { max-width: 960px; margin: 0 auto; padding: 0 24px 48px; }
  section.category { margin-bottom: 32px; }
  section.category h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card img { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }
  .card .summary { font-size: 0.95rem; line-height: 1.4; margin: 0 0 8px; }
  .card .raw { font-size: 0.8rem; color: var(--muted); margin: 0 0 8px; word-break: break-word; }
  .card .meta { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; }
  .status-pending { color: #d97706; }
  .status-error { color: #dc2626; }
  .empty { color: var(--muted); text-align: center; padding: 64px 24px; }
</style>
</head>
<body>
<header>
  <h1>Idea Vault</h1>
  <p class="subtitle">{{ total }} idea{{ "s" if total != 1 else "" }} captured</p>
  <form class="search" method="get" action="/">
    <input type="search" name="q" placeholder="Search ideas…" value="{{ query }}">
    <button type="submit">Search</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
